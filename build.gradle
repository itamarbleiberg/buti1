plugins {
	// Minecraft 1.21.11 and older are obfuscated, so they use the remapping version of Loom.
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
	archivesName = project.name
}

repositories {
	mavenCentral()
	maven {
		name = 'Simple Voice Chat'
		url = 'https://maven.maxhenkel.de/repository/public'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Only needed to compile the voice chat plugin. Simple Voice Chat provides it at runtime.
	compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
}

// Automated in-game test (src/gametest). Not part of the mod jar. Run with: ./gradlew runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "playercharacters-test"
		enableGameTests = false
		enableClientGameTests = true
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
